name: WinUI build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Publish complete x64 application
        shell: pwsh
        run: ./scripts/Build-WinUI.ps1
      - name: Compile audio verification helper
        shell: pwsh
        run: dotnet build tests/AudioProbe/AudioProbe.csproj -c Release
      - name: Verify synchronization analyzer counterexamples
        shell: pwsh
        run: node --test tests/Analyze-Sync.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: VideoPlay-win-x64
          path: dist/win-x64/
          if-no-files-found: error
          retention-days: 7
